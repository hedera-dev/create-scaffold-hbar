name: Lint Instances

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          [
            hardhat,
            foundry,
            no_solidity_framework,
          ]
    steps:
      - uses: actions/checkout@v4

      - name: Set dummy git user
        run: |
          git config --global user.name "Dummy User"
          git config --global user.email "dummy@example.com"

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: yarn

      - name: Install Foundry
        if: matrix.config == 'foundry'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
          version: v1.8.1

      - name: Build
        run: yarn build

      - name: Install application (Hardhat configuration)
        if: matrix.config == 'hardhat'
        run: yarn cli new_project_hardhat -s hardhat --ci --skip-hedera-skills

      - name: Install application (Foundry configuration)
        if: matrix.config == 'foundry'
        run: yarn cli new_project_foundry -s foundry --ci --skip-hedera-skills

      - name: Install application (No solidity framework configuration)
        if: matrix.config == 'no_solidity_framework'
        run: yarn cli new_project_no_solidity_framework -t hedera-demo -s none --ci --skip-hedera-skills

      - name: Compile contracts
        working-directory: new_project_${{ matrix.config }}
        if: matrix.config == 'hardhat' || matrix.config == 'foundry'
        run: yarn ${{ matrix.config }}:compile

      - name: Run linting hardhat package
        if: matrix.config == 'hardhat'
        working-directory: new_project_${{ matrix.config }}
        run: yarn hardhat:lint --max-warnings=0

      - name: Run linting foundry package
        if: matrix.config == 'foundry'
        working-directory: new_project_${{ matrix.config }}
        run: yarn foundry:lint

      - name: Run linting nextjs package
        working-directory: new_project_${{ matrix.config }}
        run: yarn next:lint --max-warnings=0

      - name: Check types nextjs package
        working-directory: new_project_${{ matrix.config }}
        run: yarn next:check-types
